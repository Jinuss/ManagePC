name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build Windows
        run: npm run publish:win

      - name: Show dist
        shell: pwsh
        run: |
          Get-ChildItem dist -Recurse

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: dist/**

  macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build macOS
        run: npm run publish:mac

      - name: Show dist
        run: |
          find dist

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dist
          path: dist/**

  release:
    runs-on: ubuntu-latest
    needs:
      - windows
      - macos

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Show release files
        run: |
          find release -type f

      - name: Create Release if needed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || \
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes

      - name: Upload Windows files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find release/windows-dist -type f -exec gh release upload "${{ github.ref_name }}" "{}" --clobber \;

      - name: Upload macOS files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find release/macos-dist -type f -exec gh release upload "${{ github.ref_name }}" "{}" --clobber \;
