name: Windows Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # 必须，否则无法创建 Release

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build frontend
        run: npm run build:frontend   # 没前端就删

      - name: Publish
        run: npm run publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}