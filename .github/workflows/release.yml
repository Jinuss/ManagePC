name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build Windows
        run: npm run publish:win

      - name: Show dist
        shell: pwsh
        run: |
          Get-ChildItem dist

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: dist/**

  macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build macOS
        run: npm run publish:mac

      - name: Show dist
        run: |
          ls -la dist

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dist
          path: dist/**

  release:
    runs-on: ubuntu-latest
    needs:
    - windows
    - macos

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Generate Release Notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --output RELEASE_NOTES.md

      - name: Show Release Notes
        run: |
          echo "========== RELEASE NOTES =========="
          cat RELEASE_NOTES.md

      - name: Create or Update Release
        run: |
          if gh release view "${{ github.ref_name }}" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release already exists, updating notes..."
            gh release edit "${{ github.ref_name }}" \
              --repo "$GH_REPO" \
              --notes-file RELEASE_NOTES.md
          else
            echo "Creating new release..."
            gh release create "${{ github.ref_name }}" \
              --repo "$GH_REPO" \
              --title "${{ github.ref_name }}" \
              --notes-file RELEASE_NOTES.md
          fi

      - name: Upload release assets
        run: |
         shopt -s globstar nullglob

          files=(
           release/windows-dist/*.exe
           release/windows-dist/*.exe.blockmap
           release/windows-dist/latest.yml

           release/macos-dist/*.dmg
           release/macos-dist/*.dmg.blockmap
           release/macos-dist/*.zip
           release/macos-dist/latest-mac.yml
          )

          if [ ${#files[@]} -eq 0 ]; then
           echo "No release assets found."
           exit 1
          fi

         for file in "${files[@]}"; do
          echo "Uploading: $file"
          gh release upload "${{ github.ref_name }}" "$file" \
            --repo "$GH_REPO" \
            --clobber
         done

      - name: Done
        run: echo "Release completed successfully."
