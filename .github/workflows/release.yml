name: Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # 必须，否则无法创建 Release

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Publish
        run: npm run publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Show dist
        shell: pwsh
        run: |
          Get-ChildItem dist   
