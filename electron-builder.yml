appId: com.example.system-monitor
productName: SuperSystemMonitor
directories:
  output: dist

files:
  - out/**/*
  - package.json

extraResources:
  - from: resources/assets/icons
    to: icons

generateUpdatesFilesForAllChannels: true

publish:
  provider: github
  repo: ManagePC
  owner: Jinuss
  releaseType: release

win:
  target: nsis
  executableName: SuperSystemMonitor
  icon: resources/assets/icons/windows/icon.ico

mac:
  target: dmg
  category: public.app-category.utilities
  icon: resources/assets/icons/macos/icon.icns

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

  createDesktopShortcut: always
  createStartMenuShortcut: true

  installerIcon: resources/assets/icons/windows/icon.ico
  uninstallerIcon: resources/assets/icons/windows/icon.ico
