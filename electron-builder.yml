appId: com.example.system-monitor
productName: Super System Monitor

directories:
  output: dist

files:
  - out/**/*
  - package.json

extraResources:
  - from: resources/assets/icons
    to: icons

win:
  target:
    - nsis
  icon: resources/assets/icons/windows/icon.ico
  executableName: SuperSystemMonitor

nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Super System Monitor

mac:
  target:
    - dmg
  icon: resources/assets/icons/macos/icon.icns