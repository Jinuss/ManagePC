appId: com.example.system-monitor
productName: Super System Monitor

directories:
  output: dist

files:
  - out/**/*
  - package.json

extraResources:
  - from: resources/assets/icons
    to: icons

win:
  target:
    - nsis
  icon: resources/assets/icons/windows/icon.ico
  executableName: SuperSystemMonitor
  artifactName: "Super-System-Monitor-Setup-${version}.${ext}"

nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Super System Monitor

mac:
  target:
    - dmg
  icon: resources/assets/icons/macos/icon.icns
  identity: "-"
  gatekeeperAssess: false

# 作用：方便于windows平台自动更新，--publish=never，不自动发布到github仓库
publish:
  provider: github
  owner: Jinuss
  repo: ManagePC
  releaseType: release  

