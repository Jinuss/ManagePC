appId: com.example.system-monitor
productName: Super System Monitor
directories:
  output: dist
files:
  - out/**/*
  - package.json
publish:
  provider: github
  repo: ManagePC
  owner: Jinuss
  releaseType: release
  channel: latest
  generateUpdatesFilesForAllChannels: true
win:
  target: nsis
  icon: resources/assets/icons/windows/icon.ico
nsis:
  installerIcon: resources/assets/icons/windows/icon.ico
  uninstallerIcon: resources/assets/icons/windows/icon.ico
mac:
  target: dmg
  category: public.app-category.utilities